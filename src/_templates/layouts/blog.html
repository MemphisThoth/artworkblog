<!DOCTYPE html>
<html lang="en">
{% include "partials/head.html" %}
<body>
        {% include "partials/header.html" %}
        <div class="container">
        <main>
            {{ content }}

            <nav>
  {% if page.next %}
    <a href="{{ page.next.url }}">Newer: {{ page.next.title }} →</a>
  {% endif %}

  {% if page.previous %}
    <a href="{{ page.previous.url }}">← Older: {{ page.previous.title }}</a>
  {% endif %}
</nav>
        </main>
        </div>
        {% include "partials/footer.html" %}


    <script src="/assets/scripts/navtoggle.js"></script>
</body>
</html>
